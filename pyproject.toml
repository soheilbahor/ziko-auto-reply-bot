[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ziko-assistant"
dynamic = ["version"]
description = "ZIKO Personal Assistant: Telegram Business auto-reply assistant"
requires-python = ">=3.12"
dependencies = [
    "aiogram==3.34.0",
    "aiosqlite==0.22.1",
    "rich>=13.7,<16",
    "cryptography>=46.0.7,<51",
    "psutil>=6.1,<8",
]

[project.scripts]
ziko = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["*.sql", "*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# Tests that need a dependency missing from the environment call pytest.importorskip
# and are reported as SKIPPED, never silently passed.
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pyflakes + pycodestyle errors: real bugs and unambiguous style errors only.
# Line length is not enforced (E501): existing modules use long Persian strings.
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.dynamic]
version = {file = ["VERSION"]}
