
name: ZIKO Deep Debug

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ziko-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Environment report
        run: |
          python --version
          pip --version
          uname -a
          git status --short

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          fi

      - name: Compile check
        run: |
          python -m compileall -q .

      - name: Ruff
        run: |
          pip install ruff
          ruff check . --output-format=github

      - name: Shell syntax
        run: |
          find . -name "*.sh" -print0 |
          xargs -0 -r -n1 bash -n

      - name: ShellCheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find . -name "*.sh" -print0 |
          xargs -0 -r shellcheck

      - name: Run tests
        env:
          PYTHONUNBUFFERED: "1"
        run: |
          pytest -vv --tb=long --maxfail=1

      - name: Dependency audit
        if: always()
        run: |
          pip install pip-audit
          pip-audit

      - name: Upload debug reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ziko-debug-reports
          path: |
            test-results/
            logs/
            .pytest_cache/
          if-no-files-found: ignore
          retention-days: 7
