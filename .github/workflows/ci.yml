name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies (requirements-dev.txt includes requirements.txt)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install "ruff==0.16.9"
          pip-audit -r requirements-dev.txt

      - name: Guard - no secrets, databases or backups are tracked
        run: |
          bad="$(git ls-files | grep -Ei '(^|/)\.env$|\.env\.[^/]*$|\.(sqlite3?|db)(-wal|-shm)?$|(^|/)backups/|\.pem$' | grep -v '^\.env\.example$' || true)"
          if [ -n "$bad" ]; then
            echo "::error::Forbidden files are tracked:"; echo "$bad"; exit 1
          fi
          if git ls-files | grep -v '^data/\.gitkeep$' | grep -q '^data/'; then
            echo "::error::Files under data/ must not be tracked"; exit 1
          fi

      - name: Verify canonical version source
        run: |
          python scripts/check_version.py
          python -c 'import app; from pathlib import Path; assert app.__version__ == Path("VERSION").read_text().strip().removeprefix("v")'

      - name: Compile
        run: python -m compileall -q app tests

      - name: Ruff - errors that break code (syntax, undefined names)
        run: ruff check . --select E9,F63,F7,F82

      - name: Ruff - full project check (report only)
        continue-on-error: true
        run: ruff check . --select E4,E7,E9,F --output-format github

      - name: Pytest (strict - skipped contract checks fail the build)
        env:
          ZIKO_STRICT: "1"
        run: pytest -ra

      - name: Shell syntax (bash -n)
        run: |
          shopt -s nullglob
          bash -n install.sh
          for f in scripts/*.sh; do echo "bash -n $f"; bash -n "$f"; done

      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install -y shellcheck
          shellcheck -x install.sh scripts/*.sh
