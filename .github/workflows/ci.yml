# Continuous integration: tests, lint, syntax, dependency audit, shell checks.
# Every third-party action is pinned to a full commit SHA (tag in the comment);
# Dependabot (.github/dependabot.yml) proposes updates. The token is read-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: pytest (Python 3.12)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Compile every module
        run: python -m compileall -q app scripts tests
      - name: Run tests
        # -ra lists every skipped test with its reason; nothing is skipped silently.
        run: python -m pytest -q -ra --junitxml=pytest-report.xml
      - name: Benchmark smoke run (correctness guard, not a performance gate)
        # --strict: every suite must run (exit 5 otherwise). Exit 3 = at-most-once broken,
        # 4 = a suite crashed. All of them fail CI; "not run" is never counted as passed.
        run: python scripts/benchmark.py --quick --strict --out benchmark-ci.json
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-reports
          path: |
            pytest-report.xml
            benchmark-ci.json
          if-no-files-found: warn
          retention-days: 14

  lint:
    name: ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install ruff
        run: python -m pip install --disable-pip-version-check "ruff==0.8.6"
      - name: Lint
        run: ruff check --output-format=github app scripts tests

  audit:
    name: dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --disable-pip-version-check "pip-audit>=2.7,<3"
      - name: Audit runtime and dev requirements
        run: pip-audit -r requirements-dev.txt --strict --progress-spinner off

  shell:
    name: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax check (bash -n)
        run: for f in install.sh scripts/*.sh; do bash -n "$f" || exit 1; done
      - name: shellcheck
        # Preinstalled on ubuntu-24.04 runners. Errors fail; warnings are reported.
        run: shellcheck --severity=error install.sh scripts/*.sh
