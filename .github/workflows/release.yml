# Release: build the archive, publish SHA256SUMS, attest build provenance.
# scripts/update.sh and scripts/install-from-github.sh refuse any archive whose
# checksum or attestation (gh attestation verify) does not match.
name: release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  verify:
    name: tests before release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Tag matches VERSION
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          [ "v${version#v}" = "${GITHUB_REF_NAME}" ] || { echo "tag $GITHUB_REF_NAME != VERSION $version"; exit 1; }
      - name: Tests
        run: python -m pytest -q -ra
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt --strict --progress-spinner off

  build:
    name: build, checksum, attest, publish
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release        # add required reviewers in repo settings
    permissions:
      contents: write           # create the GitHub Release
      id-token: write           # OIDC for the attestation
      attestations: write       # store the attestation
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build reproducible archive
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          name="ziko-assistant-${TAG}"
          mkdir -p dist
          # git archive is deterministic for a given commit (file order, modes, mtime = commit
          # time); gzip -n drops the gzip timestamp. Paths marked export-ignore in
          # .gitattributes (tests, CI config) are left out.
          git archive --format=tar --prefix="${name}/" HEAD | gzip -n -9 > "dist/${name}.tar.gz"
          ( cd dist && sha256sum "${name}.tar.gz" > SHA256SUMS )
          # Same checks the updater runs on a server: layout, required files, no .env/db, VERSION.
          python scripts/release_asset.py verify --file "dist/${name}.tar.gz" \
            --sums dist/SHA256SUMS --asset "${name}.tar.gz" --tag "$TAG"
          cat dist/SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Release notes = only this version's CHANGELOG section (not the whole history).
          awk -v v="${TAG#v}" 'index($0, "## [") == 1 { p = (index($0, "## [" v "]") == 1) } p' \
            CHANGELOG.md > release-notes.md
          test -s release-notes.md || { echo "no CHANGELOG section for $TAG"; exit 1; }
          gh release create "$TAG" dist/*.tar.gz dist/SHA256SUMS \
            --title "$TAG" --notes-file release-notes.md --verify-tag
